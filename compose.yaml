services:
  visa-dashboard:
    build: .
    container_name: visa-dashboard
    restart: unless-stopped
    ports:
      - "80:8080"
    environment:
      NODE_ENV: production
      PORT: 8080
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
